; PlatformIO project — WebMIDI ↔ USB/UART bridge
;
; Two environments:
;   pico    firmware for the Raspberry Pi Pico 1 (RP2040)
;   native  host-compiled unit tests for lib/bridge_proto, which is deliberately
;           free of Arduino and RP2040 dependencies so it can be tested without
;           hardware. See DECISIONS.md D1.

[platformio]
default_envs = pico
src_dir = src
lib_dir = lib

[env:pico]
platform = raspberrypi
board = pico
framework = arduino
board_build.core = earlephilhower

; Adafruit TinyUSB is required for a USB MIDI device; the core's default Pico
; SDK USB stack only offers CDC.
;
; CDC cannot be switched off (-DCFG_TUD_CDC=0 fails to build — Adafruit's
; Arduino API layer calls tud_cdc_n_write_flush unconditionally), so the device
; enumerates as composite MIDI + CDC. That turns out to be useful: the CDC
; interface is a debug console that does not disturb the MIDI tunnel.
build_flags =
    -DUSE_TINYUSB
    -Wall
    -Wextra
    -std=gnu++17
build_unflags = -std=gnu++14

; The Pico 1 has no debug probe by default; upload over the USB bootloader.
upload_protocol = picotool
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -DBRIDGE_HOST_BUILD
; Only the portable protocol library takes part in the native build.
lib_compat_mode = off
test_build_src = no
