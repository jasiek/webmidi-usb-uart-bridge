; PlatformIO project — WebMIDI ↔ USB/UART bridge
;
; Two environments:
;   pico    firmware for the Raspberry Pi Pico 1 (RP2040)
;   native  host-compiled unit tests for lib/bridge_proto, which is deliberately
;           free of Arduino and RP2040 dependencies so it can be tested without
;           hardware. See DECISIONS.md D1.

[platformio]
default_envs = pico
src_dir = src
lib_dir = lib

[env:pico]
platform = raspberrypi
board = pico
framework = arduino
board_build.core = earlephilhower

; Adafruit TinyUSB is required for a composite/custom USB MIDI device; the
; core's default Pico SDK USB stack only offers CDC.
build_flags =
    -DUSE_TINYUSB
    -DCFG_TUD_MIDI=1
    -DCFG_TUD_CDC=0
    -Wall
    -Wextra
    -std=gnu++17
build_unflags = -std=gnu++14

; The Pico 1 has no debug probe by default; upload over the USB bootloader.
upload_protocol = picotool
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -DBRIDGE_HOST_BUILD
; Only the portable protocol library takes part in the native build.
lib_compat_mode = off
test_build_src = no
