; PlatformIO project — WebMIDI ↔ USB/UART bridge
;
; Two environments:
;   pico    firmware for the Raspberry Pi Pico 1 (RP2040)
;   native  host-compiled unit tests for lib/bridge_proto, which is deliberately
;           free of Arduino and RP2040 dependencies so it can be tested without
;           hardware. See DECISIONS.md D1.

[platformio]
default_envs = pico
src_dir = src
lib_dir = lib

[env:pico]
platform = raspberrypi
board = pico
framework = arduino
board_build.core = earlephilhower

; Adafruit TinyUSB is required for a USB MIDI device; the core's default Pico
; SDK USB stack only offers CDC.
;
; CDC cannot be switched off (-DCFG_TUD_CDC=0 fails to build — Adafruit's
; Arduino API layer calls tud_cdc_n_write_flush unconditionally), so the device
; enumerates as composite MIDI + CDC. That turns out to be useful: the CDC
; interface is a debug console that does not disturb the MIDI tunnel.
build_flags =
    -DUSE_TINYUSB
    -Wall
    -Wextra
    -std=gnu++17
build_unflags = -std=gnu++14

; The Pico 1 has no debug probe by default; upload over the USB bootloader.
upload_protocol = picotool
monitor_speed = 115200

; Same firmware plus a once-a-second status line on the CDC interface, which
; rides beside MIDI without disturbing it. The counters are what distinguish a
; wedged loop() from a silent transport — see FINDINGS.md.
[env:pico_debug]
extends = env:pico
build_flags =
    ${env:pico.build_flags}
    -DBRIDGE_DEBUG
    -DBRIDGE_TRACE_PHASE

; Phase 2: the far end is a USB CDC/ACM serial adapter on a bit-banged host
; port (Pico-PIO-USB) at GPIO16/GPIO17, instead of the hardware UART.
; DECISIONS.md D1 and D7; hardware/README.md for what the port needs built.
[env:pico_cdc]
extends = env:pico
; Pico-PIO-USB derives its bit clock from the system clock and will not
; enumerate unless that is a multiple of 12 MHz. The Pico's default 125 MHz is
; not; 120 MHz is. The core applies F_CPU with set_sys_clock_khz() before
; anything else starts (cores/rp2040/main.cpp), which is why this is a build
; setting rather than a call in setup() — by setup() the peripherals have
; already been configured against the old divisors.
board_build.f_cpu = 120000000L
; The host stack is not switched on by a flag: the core's tusb_config for the
; RP2040 enables it, with the PIO-USB controller, if `pio_usb.h` is on the
; include path (`__has_include`). PlatformIO's dependency finder cannot see a
; conditional include like that, so the path has to be spelled out — without
; the -I the build silently falls back to a MAX3421E host that is not there.
build_flags =
    ${env:pico.build_flags}
    -DBRIDGE_BACKEND_CDC_HOST
    -I$PROJECT_LIBDEPS_DIR/$PIOENV/Pico-PIO-USB/src
lib_deps = https://github.com/sekigon-gonnoc/Pico-PIO-USB.git#0.7.2

[env:pico_cdc_debug]
extends = env:pico_cdc
build_flags =
    ${env:pico_cdc.build_flags}
    -DBRIDGE_DEBUG
    -DBRIDGE_TRACE_PHASE

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -DBRIDGE_HOST_BUILD
; Only the portable protocol library takes part in the native build.
lib_compat_mode = off
test_build_src = no
